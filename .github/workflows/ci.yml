name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned: this image ships the Android SDK, so no setup action is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: orloncode-debug-apk, path: app/build/outputs/apk/debug/*.apk }
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check of the sandbox scripts
        run: for f in app/src/main/assets/sandbox/orlon-*; do echo "checking $f"; sh -n "$f"; done
